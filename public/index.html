<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dedccf">
  <meta name="description" content="주찬, 경후, 강희, 용환과 함께하는 오목의 전설.">
  <title>오목의 전설 — 프로필 선택</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23efc45c' stroke='%23282a25' stroke-width='4' d='M2 2h36v36H2z'/%3E%3Ccircle cx='15' cy='15' r='8' fill='%23282a25'/%3E%3Ccircle cx='25' cy='25' r='8' fill='%23fffef4' stroke='%23282a25' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/profile" id="home-link" aria-label="오목의 전설 프로필 선택">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>오목의 전설</span>
      </a>
      <div class="connection" id="connection" role="status"><span class="status-dot"></span><span id="connection-text">서버 연결 중</span></div>
    </header>
    <nav class="journey" aria-label="게임 진행 단계">
      <ol><li data-step="profile" aria-current="step"><span>01</span> 프로필 선택</li><li class="step-line" aria-hidden="true"></li><li data-step="lobby"><span>02</span> 대국실</li><li class="step-line" aria-hidden="true"></li><li data-step="game"><span>03</span> 대국</li></ol>
    </nav>
    <main id="main">
      <section id="profile-page" data-page="profile" aria-labelledby="profile-heading">
        <div class="profile-stage">
          <h1 id="profile-heading" tabindex="-1">프로필 선택</h1>
          <span class="small-label" id="profile-invite" hidden></span>
          <form id="profile-form">
            <div class="profile-options" id="profile-options" role="group" aria-label="이름 선택"></div>
            <button class="button primary profile-continue" id="profile-continue" type="submit" disabled>이름을 선택해 주세요</button>
          </form>
        </div>
      </section>
      <section id="lobby-page" data-page="lobby" aria-labelledby="lobby-heading" hidden>
        <div class="intro"><h1 id="lobby-heading" tabindex="-1">대국실</h1><div class="active-profile" id="active-profile"><div id="active-profile-avatar"></div><div><strong id="active-profile-name"></strong><button class="link-button" id="change-profile" type="button">프로필 변경</button></div></div></div>
        <div class="lobby-layout">
          <section class="card" aria-labelledby="create-heading">
            <div class="section-heading"><h2 id="create-heading">방 만들기</h2></div>
            <form id="create-form">
              <label for="room-title">방 이름 <span class="optional">선택</span></label>
              <input id="room-title" maxlength="28">
              <label class="check-label"><input type="checkbox" id="private-room"><span>비공개</span></label>
              <button class="button primary full" id="create-button" type="submit"><span>방 만들기</span><span aria-hidden="true">＋</span></button>
            </form>
            <div class="divider" aria-hidden="true"></div>
            <form id="join-form">
              <label for="room-code">초대 코드</label>
              <div class="join-row"><input id="room-code" maxlength="6" autocomplete="off" spellcheck="false" placeholder="ABC123" pattern="[A-Za-z2-9]{6}" title="영문·숫자 6자리" required><button class="button secondary" id="join-button" type="submit">참가</button></div>
            </form>
          </section>
          <section class="card lobby-rooms" aria-labelledby="waiting-heading">
            <div class="section-heading"><h2 id="waiting-heading">기다리는 대국실 <span class="count" id="room-count">0</span></h2><button class="icon-button" id="refresh-rooms" aria-label="대국실 목록 새로고침" type="button">↻</button></div>
            <div id="room-list"><p class="empty-rooms">대기 중인 방 없음</p></div>
          </section>
        </div>
      </section>
      <section id="game-page" data-page="game" aria-labelledby="game-heading" hidden>
        <div class="game-page-top"><h1 id="game-heading" tabindex="-1">오목</h1><button class="button secondary" id="leave-button" type="button">← 대기실로</button></div>
        <div class="game-layout">
          <section class="game-card" aria-label="오목 대전">
            <div class="game-header"><div><p class="eyebrow" id="game-eyebrow"></p><h2 id="game-title"></h2></div><span class="round-badge" id="round-label"></span></div>
            <div class="players" id="players"></div>
            <div class="board-area"><div class="board-wrap">
              <div class="column-labels" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span><span>L</span><span>M</span><span>N</span><span>O</span></div>
              <div class="row-labels" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span></div>
              <div id="board" class="board" role="grid" aria-label="15줄 오목판. 방향키로 이동하고 Enter로 위치를 선택한 뒤 착수 버튼을 누르세요." aria-rowcount="15" aria-colcount="15"></div>
            </div></div>
            <div class="game-bottom">
              <div class="turn-status" role="status" aria-live="polite"><span class="turn-symbol" id="turn-symbol"></span><strong id="status-title"></strong></div>
              <div class="game-actions"><button class="button text-button" id="resign-button" type="button" hidden>기권</button><button class="button primary place-button" id="place-button" type="button" disabled>위치를 선택해 주세요</button><button class="button primary" id="rematch-button" type="button" hidden>한 판 더 두기</button></div>
            </div>
            <div class="board-note">15 × 15 · 자유룰</div>
          </section>
          <aside class="game-sidebar" aria-label="초대">
            <section class="card room-info">
              <div class="section-heading"><h2>초대 코드</h2><span class="small-label" id="visibility-label">공개</span></div>
              <div class="invite-code" id="invite-code"></div>
              <button class="button secondary full" id="copy-code" type="button">초대 코드 복사</button>
              <button class="button text-button full" id="copy-link" type="button">초대 링크 복사 ↗</button>
            </section>
          </aside>
        </div>
      </section>
    </main>
    <footer class="site-footer"><span>오목의 전설</span></footer>
  </div>
  <div class="toast" id="toast" role="alert" hidden></div>
  <dialog id="game-event-dialog" class="game-event-dialog" aria-labelledby="game-event-title" aria-describedby="game-event-body">
    <button class="icon-button event-close" id="game-event-close" type="button" aria-label="안내를 닫고 오목판 보기">×</button>
    <div class="event-players" id="game-event-players" aria-label="이번 판의 참가자"></div>
    <h2 id="game-event-title"></h2>
    <p id="game-event-body"></p>
    <div class="event-actions"><button class="button primary full" id="game-event-primary" type="button" autofocus></button><button class="button text-button full" id="game-event-secondary" type="button"></button></div>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title"></h2><div class="dialog-actions"><button class="button secondary" value="cancel" id="confirm-cancel">아니오</button><button class="button primary" value="confirm" id="confirm-action">예</button></div></form></dialog>
</body>
</html>
